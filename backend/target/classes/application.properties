# Server Port
server.port=8080

# Application Name
spring.application.name=Rural Service Request Portal

# MongoDB Atlas Connection (using placeholder env variable MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rsrp_db}

# Logging configuration
logging.level.org.springframework.web=INFO
logging.level.com.rsrp.portal=DEBUG
